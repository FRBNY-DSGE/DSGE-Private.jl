name: CI
on: [push, pull_request]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
            - '1.12'
        arch:
            - x64
        os:
            - ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # SMC's mutation code calls ModelConstructors.n_param_regs, which is absent
      # from the v0.2.5 tag. Pin a reviewed upstream commit that includes it and
      # the Julia 1.12 compatibility fixes.
      - name: "Use Julia 1.12-compatible ModelConstructors"
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.add(PackageSpec(url = "https://github.com/FRBNY-DSGE/ModelConstructors.jl", rev = "aa8b184fc16cc65f6523d31122fc2957a2368a5e"))'
      # DSGE's tests use SMC APIs newer than the latest registered SMC release.
      # Old: rev = "152cdc8003da57fd4a631cc9be88df6c9d4972ee" (fix/mixture-draw-rng). DSGE now passes
      # param_blocks and blockwise_c to SMC.smc, which that commit does not accept.
      - name: "Use reviewed SMC param-blocks commit"
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.add(PackageSpec(url = "https://github.com/FRBNY-DSGE/SMC.jl", rev = "270e28356cc5fbf6f4884f121ae1a29cffdd7ba6"))'
      - uses: julia-actions/julia-buildpkg@v1
      - name: "Run the complete package test suite"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: julia --project=. --color=yes --code-coverage=user -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
