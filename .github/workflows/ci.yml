name: CI
on: [push, pull_request]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
            - '1.12'
        arch:
            - x64
        os:
            - ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # The registered ModelConstructors 0.2.4 only permits DataFrames <= 0.22,
      # whose SortingAlgorithms dependency has no Julia 1.12-compatible release.
      # Upstream v0.2.5 widens that bound to DataFrames 1; the DSGE compat range
      # already accepts this version.
      - name: "Use Julia 1.12-compatible ModelConstructors"
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.add(PackageSpec(url = "https://github.com/FRBNY-DSGE/ModelConstructors.jl", rev = "v0.2.5"))'
      - uses: julia-actions/julia-buildpkg@v1
      - name: "Run the complete package test suite"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: julia --project=. --color=yes --code-coverage=user -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
