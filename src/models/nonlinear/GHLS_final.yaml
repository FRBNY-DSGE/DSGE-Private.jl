name: GHLS

symbols:

    exogenous: [errliq, errinv, errtech, errint, errgshk, errelast, errelastw]
    states: [cap, gdp, dp, notr, realw, liqshk, invshk, gshk]
    controls: [cc,inv]

    #states: [k, c, i, pi, w, lambda_c, qk, u, rm, y, x, R, qk, L, mc, rk, muc, Vi, Vp, Vw, pi_w, bc, bi, b, mu, ztil, mon, g, elast, elastw, unk]
    #controls: [pi,w,c,i,lambda_c,qk,u]
    expectations: [Ei, Erk, Ec, EVw, Etechshock, Epi, Eqk, Elambda_c, Ei_sh, Erk_sh, Ec_sh, EVw_sh, Etechshock_sh, Epi_sh, Eqk_sh, Elambda_c_sh]
    parameters: [delta, shrgy, epsilon_p, epsilon_w, psi_L, rho_eta, rho_int, rho_elast, rho_elastw, sigma_elast, sigma_elastw, alpha, beta, pi_bar, gz, gamma_pi, gamma_x, gamma_g, rho_R, gamma, sigma_a, sigma_L, phi_w, phi_p, phi_I, ap, aw, rho_g, rho_mu, sigma_g, sigma_eta, sigma_mu, sigma_Z, sigma_R, e_y, e_pi, e_R, e_c, e_i]


definitions:

    techshk: errtech
    gamtil: gamma/gz
    lam: (-(1+gamtil*gamtil*beta)*cc + gamtil*(cc(-1)-techshk) + gamtil*beta*(cc(1) + techshk(1)))/((1-gamtil)*(1-gamtil*beta))

    tobq: -invshk + phi_I*(1+beta)*inv-phi_I*inv(-1) - beta*phi_I*inv(+1) + phi_I*techshk - beta*phi_I*techshk(1)
    rentalk: (tobq(-1) - (1-delta)*beta/gz*tobq - lam + lam(-1) + techshk) / (1-((1-delta)*beta/gz))

    util: (1/sigma_a)*rentalk
    lab: (gdp-alpha*(util + cap(-1) - techshk))/(1-alpha)
    xhp: alpha*util + (1-alpha)*lab

    nomr: notr
    mcost: realw - (gdp - lab)

    vi =  inv - inv(-1) + techshk
    vp = dp - (1-ap)*dp(-1)

    vw = beta*vw(1) + kappa_w*(sigma_L*lab - lam - realw) - (kappa_w/(epsilon_w-1))*elastwshk
    dw = (1-aw)*dp(-1) + (1-bw)*techshk + vw

    bc = -1/(1-gamtil)*(cc(1)+gamtil*(techshk(1)-cc))
    bi = (inv(1) - inv + techshk(1))


equations:
    transition:
        cap = (1-(1-delta)/gz)*(inv + invshk) + ((1-delta)/gz)*(cap(-1) - techshk)
        gdp = gg*shrcy*cc + gshk + gg*shriy*inv + gg*alpha*((epsilon_p-1)/epsilon_p)*util
        dp = beta/(1+beta*(1-ap))*dp(+1) + (1-ap)/(1+beta*(1-ap))*dp(-1) + kappap*mcost - (kappap/(ep-1))*elastshk
        notr =  gam_rs*notr(-1) + (1-gam_rs)*( gam_dp*dp + gamxhp*xhp + gamdy*(gdp - gdp(-1) + techshk)) + intshk
        realw = realw(-1) + dw - dp - techshk
        liqshk = rho_eta*liqshk(-1) + errliq
        invshk = rho_mu*invshk(-1) + errinv
        gshk =rho_g*gshk(-1) + errgshk

[cap, gdp, dp, notr, realw, liqshk, invshk, gshk]







    gg: 1.0/(1.0-shrgy)
    gamtil: gamma/gz
    mc: (epsilon_p-1.0)/epsilon_p
    k2yrat: ((mc*alpha)/(gz/beta-(1.0-delta)))*gz
    shriy: (1.0 - (1.0-delta)/gz)*k2yrat
    shrcy: (1.0 - shrgy - shriy)
    labss: (((epsilon_w - 1.0)/epsilon_w)*(1.0-alpha)*(1.0 - beta*gamtil)*((epsilon_p-1.0)/epsilon_p)*(1.0/(psi_L*(1.0 - gamtil)))*(1.0/shrcy))^(1.0/(sigma_L+1))
    kappa_w: ((1.0-gamtil)/(1.0-beta*gamtil))*epsilon_w*psi_L*labss^(1.0+sigma_L)/phi_w
    kappa_p: (epsilon_p-1.0)/(phi_p*(1.0+beta*(1-ap)))
    kss: labss*(gz^(alpha/(alpha-1.0)))*k2yrat^(1.0/(1.0-alpha))
    gdpss: (kss/gz)^alpha*labss^(1.0-alpha)
    invss : shriy*gdpss
    phii_jpt: phi_I/invss
    css: shrcy*gdpss
    rwss: (1.0 - alpha)*mc*gdpss/labss
    mucss: (1.0/css)*(1.0/(1.0 - gamtil))
    lamss: mucss*(1.0 - beta*gamtil)
    rss: gz*pi_bar/beta
    rkss: gz/beta - 1.0 + delta
    bw : aw

    # From intermediatedec!
    #invshk = exp(mu_sh)
    #techshk = exp(ztil_sh)
    rrshk = rm_sh
    gss = 1.0/(1.0-shrgy)
    gshk = exp( log(gss) + g_sh)
    ashk = exp(0.)

    liqshk: exp(b)
    invshk: exp(mu)
    lambda_c: beta/gz * liqshk * R * lambda_c(1)/(exp(ztil_sh(1) * pi(1)))
    utilcostp: rkss/sigma_a*(exp(sigma_a*(u-1.0))-1.0)  *(exp(params[keys[:σ_a]]*(endogvarp[13]-1.0))-1.0)
    qk: beta/(gz*lambda_c) * (lambda_c(1)/exp(ztil(1)) * (rk(1)*u(1) - utilcostp(1) + (1.0-delta)*qk(1)))

    dptilde: pi_bar^ap * pi^(1-ap)
    bp: beta*lambda_c(1)*y(1)*(pi(1)/dptilde - 1)*pi(1)/dptilde / (lambda_c * y) + epsilon_p/phi_p * (mc - (epsilon_p-1)/epsilon_p)
    Vp: (sqrt(1.0+4.0*bp)+1.0)/2.0

    dwtilde: pi_bar^aw * pi^(1.0-aw)
    bww: beta*(pi_w(1)/dwtilde(1)-1.0)*pi_w(1)/dwtilde(1) + (epsilon_w/phi_w)*lambda_c*L*(psi_L*L^sigma_L / lambda_c - (epsilon_w-1.0)/epsilon_w * w)
    Vw: (sqrt(1.0+4.0*bww)+1.0)2.0

    bc: 1.0/(gz*exp(ztil_sh(1))) * 1.0/(c(1) - gamma*c/gz*exp(ztil_sh(1)))
    muc: lambda_c + gamma/gz*beta*bc
    Vc: muc(1)/(exp(ztil(1)))

    Vi = i/i(-1)*exp(ztil_sh)
    bi = lambda_c(1)*qk(1)*exp(mu(1))*(Vi(1)-1.0)*Vi(1)^2
    cquad_vi = bi/(qk*exp(mu_sh))-(1.0-qk*exp(mu_sh))/(phi_I*qk*exp(mu_sh))
endogvar[endogenous_states[:bi_t]]/(endogvar[endogenous_states[:qk_t]]*invshk)-(1.0-endogvar[endogenous_states[:qk_t]]*invshk)/(params[keys[:ϕ_I]]*endogvar[endogenous_states[:qk_t]]*invshk)

    Vi = 0.5*(1.0+sqrt(1.0+4.0*cquad_vi))
    i = Vi*i(-1)*exp(ztil_sh)
    ev_i = lambda_c(1)*qk(1)*exp(mu(1))*(Vi(1)-1.0)*Vi(1)^2

    ev_u = 1.0 + 1.0/sigma_a * log(rk/rkss)

endogvarp[endogenous_states[:λc]]*endogvarp[endogenous_states[:qk_t]]*invshkp*(endogvarp[endogenous_states[:Vi_t]]-1.0)*endogvarp[endogenous_states[:Vi_t]]*endogvarp[endogenous_states[:Vi_t]]


calibration:

    # Parameters
    delta: 0.025
    shrgy: 0.2
    epsilon_p: 6.0
    epsilon_w: 8.0
    psi_L: 1.0
    rho_eta: 0.9
    rho_int: 0.0
    rho_elast: 0.98
    rho_elastw: 0.98
    sigma_elast: 0.01
    sigma_elastw: 0.01

    # Steady-state parameters
    alpha: 0.167
    beta: 0.9985
    pi_bar: 1.006
    gz: 1.005

    # Monetary Policy Rule Parameters
    gamma_pi: 1.9
    gamma_x: 0.164
    gamma_g: 0.73
    rho_R: 0.6945

    # Endogenous Propagation Parameters
    gamma: 0.5232
    sigma_a: 5.65
    sigma_L: 2.047
    phi_w: 4029.7
    phi_p: 113.363
    phi_I: 3.48
    ap: 0.265
    aw: 0.69

    # Exogenous Process Parameters - Autocorrelation
    rho_g: 0.95
    rho_mu: 0.77

    # Exogenous Process Parameters - Standard Deviation
    sigma_g: 0.00177
    sigma_eta: 0.00138
    sigma_mu: 0.00494
    sigma_Z: 0.00421
    sigma_R: 0.0018

    #Measurement Errors
    e_y: 0.00323357
    e_pi: 0.00122426
    e_R: 0.00358562
    e_c: 0.00256811
    e_i: 0.01218603

    #Start of real steady states
    cap: log(kss)
    cc: log(css)
    inv: log(invss)
    rw: log(rwss)
    notr: log(rss)
    dp: log(pi_bar)
    gdp: log(gdpss)
    xhp: 0.0
    nomr: log(rss)
    lam: log(lamss)
    qq: 0.0
    lab: log(labss)
    util: 0.0
    mc: log(mc)
    rentalk: log(rkss)
    muc: log(mucss)
    vi: 0.0
    vp: 0.0
    vw: 0.0
    dw: log(pi_bar*gz)
    bc: log(mucss)
    bi: 0.0
    liqshk: 0.0
    invshk: 0.0
    techshk: 0.0
    intshk: 0.0
    gshk: log(gg)
    ashk: 0.0

equations:

    arbitrage:
        - c*(-beta*gamtil^2 - 1.0) + beta*gamtil*Ec - lambda_c*(1.0-gamtil)*(1.0-beta*gamtil) - ztil*gamtil + beta*gamtil*Etechshock + gamtil*c(-1)
        - k + ((1.0-delta)/gz)*(i + mu + ztil - k(-1)) - i - mu
        - qk + lambda_c + (beta/gz*(1.0-delta) + 1.0)*Erk + Etechshock - beta/gz*(1.0-delta)*Eqk - Elambda_c
        - gg*shrcy*(c+i) - y + alpha/epsilon_p*gg*(epsilon_p-1.0)*u + g
        - u - rk/sigma_a
        - w + L - u - rk + ztil - k(-1)
        - mc*kappa_p - pi + Epi*beta/(beta*(1.0-ap)+1.0) + pi(-1)*(1.0-ap)/(beta*(1.0-ap)+1.0)
        - pi_w - w - pi - ztil + w(-1)
        - -rm + (gamma_pi*pi + gamma_g*(y + ztil - y(-1)) + gamma_x*x)*(1.0-rho_R) + mon + rho_R*rm(-1)
        - rm - R
        - -x + (1.0-alpha)*L + u*alpha
        - i*phii_jpt*(1.0+beta) - qk - mu + ztil*phii_jpt - (Ei+Etechshock)*beta*phii_jpt - i(-1)*phii_jpt
        - y - L*(1.0-alpha) - alpha*u + ztil*alpha - (1.0-alpha)*unk - alpha*k(-1)
        - w - y + L - mc
        - -c + muc*(gamtil-1.0) - ztil*gamtil + gamtil*c(-1)
        - rm - lambda_c + b - Etechshock - Epi + Elambda_c
        - Vw - pi_w + ztil*(1.0-bw) + pi(-1)*(1.0-aw)
        - i - Vi + ztil - i(-1)
        - pi - Vp - pi(-1)*(1.0-ap)
        - kappa_w*(-w - lambda_c + L*sigma_L) - Vw + beta*EVw
        - (c*gamtil - Ec)/(1.0-gamtil) - bc - Etechshock*gamtil/(1.0 - gamtil)
        - -i - bi + Ei + Etechshock
        - ztil - ztil_sh
        - g - g(-1)*rho_g - g_sh
        - b - b(-1)*rho_eta - b_sh
        - mu - mu(-1)*rho_mu - mu_sh
        - mon - mon(-1)*rho_int - rm_sh
        - elast - elast(-1)*rho_elast - elast_sh
        - elastw - elastw(-1)*rho_elastw - elastw_sh
        - unk - unk_sh
        - Ec(-1) + Ec_sh - c
        - Eqk(-1) + Eqk_sh - qk
        - Ei(-1) + Ei_sh - i
        - Erk(-1) + Erk_sh - rk
        - Etechshock(-1) + Etechshock_sh - ztil
        - Elambda_c(-1) + Elambda_c_sh - lambda_c
        - EVw(-1) + EVw_sh - Vw
<!- Can I declare above AR processes as AR instead? Might speed up code!->

exogenous:!Normal
    Sigma: [sigma_eta^2, sigma_Z^2, sigma_R^2, sigma_g^2, sigma_elast^2, sigma_elastw^2, 0.0]
# Might need to specify the full matrix

options:
    grid: Smolyak
